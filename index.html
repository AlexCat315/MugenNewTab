<!DOCTYPE html>
<html lang="zh-CN" data-theme-loading="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#B14A6B">
    <title>Mugen新标签页</title>
    <style>
        html[data-theme-loading] body {
            opacity: 0;
            visibility: hidden;
        }
        html[data-theme-loaded] body {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease;
        }
    </style>
    <!-- 主题预加载脚本须为外部文件：扩展 CSP（script-src 'self'）禁止内联脚本，内联会导致白屏 -->
    <script src="/theme-preload.js"></script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
